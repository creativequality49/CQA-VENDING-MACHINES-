name: Marketplace release gates
on:
  pull_request:
    paths:
      - "app/api/marketplace/**"
      - "app/api/owner/marketplace-asset/**"
      - "app/marketplace/library/**"
      - "app/owner/marketplace-upload/**"
      - "lib/cqa-marketplace-delivery.ts"
      - "lib/storage.ts"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/marketplace-release-gates.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:commerce
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
